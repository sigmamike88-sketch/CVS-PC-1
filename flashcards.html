<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVS Flashcards</title>
    <style>
        /* Basic styling to match your existing dark theme */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            margin-bottom: 20px;
        }

        .back-btn {
            color: #58a6ff;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* Flashcard Container */
        .flashcard-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 60vh;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .flashcard-face.front {
            font-size: 20px;
            font-weight: 500;
        }

        .flashcard-face.back {
            transform: rotateY(180deg);
            font-size: 18px;
            color: #8b949e;
        }

        /* Controls */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .counter {
            margin-top: 15px;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← Back to Main Page</a>
        <h1>CVS Flashcards</h1>
    </div>

    <div class="flashcard-container">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="flashcard-face front" id="question">Loading question...</div>
            <div class="flashcard-face back" id="answer">Loading answer...</div>
        </div>
        
        <div class="counter" id="counter">1 / 1</div>

        <div class="controls">
            <button onclick="prevCard()">Previous</button>
            <button onclick="nextCard()">Next</button>
        </div>
    </div>

    <script>
        // 1. ADD YOUR FLASHCARD DATA HERE
        const flashcards = [
            {
                question: "What is the primary function of the cardiovascular system?",
                answer: "To deliver oxygen and nutrients to tissues and remove carbon dioxide and waste products."
            },
            {
                question: "What is the pacemaker of the heart?",
                answer: "The Sinoatrial (SA) node."
            },
            {
                question: "Define Systole.",
                answer: "The phase of the heartbeat when the heart muscle contracts and pumps blood from the chambers into the arteries."
            }
        ];

        let currentIndex = 0;

        // 2. LOGIC TO HANDLE THE CARDS
        function updateCard() {
            // Reset flip state when moving to a new card
            document.getElementById('flashcard').classList.remove('is-flipped');
            
            const card = flashcards[currentIndex];
            document.getElementById('question').innerText = card.question;
            document.getElementById('answer').innerText = card.answer;
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${flashcards.length}`;
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // Initialize the first card
        updateCard();
    </script>

</body>
</html>
