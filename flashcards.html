<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVS Flashcards</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>"
    />
    <style>
      :root {
        --bg: #0a0e14;
        --card: #121821;
        --border: #1f2836;
        --border-2: #2b3648;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-faint: #5a6472;
        --accent: #e91e63;
        --accent-2: #7c4dff;
        --blue: #4d9fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .header {
        width: 100%;
        max-width: 600px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: rgba(233, 30, 99, 0.08);
        border: 1px solid rgba(233, 30, 99, 0.25);
        border-radius: 999px;
        color: #e6edf3;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.25s ease;
        width: fit-content;
      }
      .back-btn:hover {
        background: rgba(233, 30, 99, 0.18);
        border-color: var(--accent);
        color: #fff;
        transform: translateX(-3px);
        box-shadow: 0 4px 14px rgba(233, 30, 99, 0.25);
      }
      .back-btn svg {
        transition: transform 0.25s ease;
      }
      .back-btn:hover svg {
        transform: translateX(-3px);
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      /* Flashcard */
      .flashcard-container {
        width: 100%;
        max-width: 600px;
        height: 420px;
        perspective: 1000px;
        margin-bottom: 20px;
      }
      .flashcard {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        cursor: pointer;
      }
      .flashcard.is-flipped {
        transform: rotateY(180deg);
      }
      .flashcard-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 40px 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .flashcard-face::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: 16px 16px 0 0;
      }
      .flashcard-face.back {
        transform: rotateY(180deg);
        background: linear-gradient(
          135deg,
          rgba(233, 30, 99, 0.05),
          rgba(124, 77, 255, 0.05)
        );
      }
      .subject-badge {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        white-space: nowrap;
        border: 1px solid;
      }
      .subject-anatomy {
        color: #e91e63;
        background: rgba(233, 30, 99, 0.12);
        border-color: rgba(233, 30, 99, 0.4);
      }
      .subject-physiology {
        color: #ff5252;
        background: rgba(255, 82, 82, 0.12);
        border-color: rgba(255, 82, 82, 0.4);
      }
      .subject-pathology {
        color: #4d9fff;
        background: rgba(77, 159, 255, 0.12);
        border-color: rgba(77, 159, 255, 0.4);
      }
      .subject-pharmacology {
        color: #9c27b0;
        background: rgba(156, 39, 176, 0.12);
        border-color: rgba(156, 39, 176, 0.4);
      }
      .subject-microbiology {
        color: #f5b800;
        background: rgba(245, 184, 0, 0.12);
        border-color: rgba(245, 184, 0, 0.4);
      }
      .subject-biochemistry {
        color: #00c853;
        background: rgba(0, 200, 83, 0.12);
        border-color: rgba(0, 200, 83, 0.4);
      }

      .card-label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 20px;
      }
      .front .card-label {
        color: var(--accent);
      }
      .back .card-label {
        color: var(--accent-2);
      }
      .card-content {
        font-size: 19px;
        line-height: 1.6;
        font-weight: 600;
        overflow-y: auto;
        max-height: 100%;
      }
      .back .card-content {
        font-size: 17px;
        font-weight: 500;
        color: #c9d1d9;
      }

      /* Controls */
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 10px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.2s;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        background: #1a2130;
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 14px rgba(233, 30, 99, 0.3);
      }
      button.primary:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        transform: translateY(-1px);
      }
      .counter {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-dim);
        min-width: 60px;
        text-align: center;
      }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
      }

      /* ===== QUESTION NAVIGATOR GRID ===== */
      .q-nav-section {
        width: 100%;
        max-width: 600px;
        margin-top: 24px;
      }
      .q-nav-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .q-nav-title .count {
        background: #171d28;
        color: var(--text-dim);
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }
      .q-nav-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding: 16px;
        background: #10151d;
        border: 1px solid var(--border);
        border-radius: 16px;
        max-height: 400px;
        overflow-y: auto;
      }
      .q-nav-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #171d28;
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        transition: all 0.15s;
        padding: 0;
        cursor: pointer;
      }
      .q-nav-btn:hover {
        border-color: var(--accent-2);
        color: var(--text);
      }
      .q-nav-btn.current {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(233, 30, 99, 0.4);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
        padding: 12px 16px;
        background: #10151d;
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-dim);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-btn">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Main Page
      </a>
      <h1>CVS Flashcards</h1>
    </div>

    <div class="flashcard-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-face front">
          <span class="subject-badge" id="subjectFront">Subject</span>
          <span class="card-label">Question</span>
          <div class="card-content" id="questionText">Loading...</div>
        </div>
        <div class="flashcard-face back">
          <span class="subject-badge" id="subjectBack">Subject</span>
          <span class="card-label">Answer</span>
          <div class="card-content" id="answerText">Loading...</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" onclick="prevCard()">← Prev</button>
      <div class="counter" id="counter">1 / 1</div>
      <button id="nextBtn" class="primary" onclick="nextCard()">Next →</button>
    </div>

    <div class="hint">Click the card to flip it · Use ← → keys to navigate</div>

    <div class="q-nav-section">
      <div class="q-nav-title">
        Jump to Question
        <span class="count" id="navCount">0</span>
      </div>
      <div class="q-nav-grid" id="qNavGrid"></div>
      <div class="legend">
        <span class="legend-item"
          ><span class="legend-dot" style="background: #e91e63"></span
          >Anatomy</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #ff5252"></span
          >Physiology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #4d9fff"></span
          >Pathology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #9c27b0"></span
          >Pharmacology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #f5b800"></span
          >Microbiology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #00c853"></span
          >Biochemistry</span
        >
      </div>
    </div>

      // ============================================================
      // STATE
      // ============================================================
      let currentIndex = 0;
      let isFlipped = false;

      const flashcardEl = document.getElementById("flashcard");
      const questionEl = document.getElementById("questionText");
      const answerEl = document.getElementById("answerText");
      const counterEl = document.getElementById("counter");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const subjectFront = document.getElementById("subjectFront");
      const subjectBack = document.getElementById("subjectBack");
      const qNavGrid = document.getElementById("qNavGrid");
      const navCount = document.getElementById("navCount");

      function getSubjectClass(subject) {
        const map = {
          Anatomy: "subject-anatomy",
          Physiology: "subject-physiology",
          Pathology: "subject-pathology",
          Pharmacology: "subject-pharmacology",
          Microbiology: "subject-microbiology",
          Biochemistry: "subject-biochemistry",
        };
        return map[subject] || "subject-anatomy";
      }

      // ===== QUESTION NAVIGATOR GRID =====
      function buildQNav() {
        qNavGrid.innerHTML = "";
        navCount.textContent = flashcards.length;
        flashcards.forEach((card, i) => {
          const btn = document.createElement("button");
          btn.className = "q-nav-btn";
          btn.textContent = i + 1;
          btn.title = card.s + ": " + card.q.substring(0, 60) + "...";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            jumpTo(i);
          });
          qNavGrid.appendChild(btn);
        });
      }

      function updateQNavHighlight() {
        const buttons = qNavGrid.querySelectorAll(".q-nav-btn");
        buttons.forEach((btn, i) => {
          if (i === currentIndex) btn.classList.add("current");
          else btn.classList.remove("current");
        });
      }

      function jumpTo(index) {
        if (index < 0 || index >= flashcards.length) return;
        currentIndex = index;
        updateCard();
        const activeBtn = qNavGrid.querySelectorAll(".q-nav-btn")[index];
        if (activeBtn)
          activeBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ============================================================
      // CARD LOGIC
      // ============================================================
      function updateCard() {
        const card = flashcards[currentIndex];
        if (!card) return;

        flashcardEl.classList.remove("is-flipped");
        isFlipped = false;

        const subjectClass = getSubjectClass(card.s);
        subjectFront.textContent = card.s;
        subjectFront.className = "subject-badge " + subjectClass;
        subjectBack.textContent = card.s;
        subjectBack.className = "subject-badge " + subjectClass;

        questionEl.textContent = card.q;
        answerEl.textContent = card.a;

        counterEl.textContent = `${currentIndex + 1} / ${flashcards.length}`;

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === flashcards.length - 1;

        updateQNavHighlight();
      }

      function flipCard() {
        flashcardEl.classList.toggle("is-flipped");
        isFlipped = !isFlipped;
      }

      function nextCard() {
        if (currentIndex < flashcards.length - 1) {
          currentIndex++;
          updateCard();
        }
      }

      function prevCard() {
        if (currentIndex > 0) {
          currentIndex--;
          updateCard();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " ") {
          e.preventDefault();
          flipCard();
        }
      });

      // ============================================================
      // BOOT
      // ============================================================
      buildQNav();
      updateCard();
    </script>
